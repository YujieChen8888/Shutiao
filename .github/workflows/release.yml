name: Build Shutiao for macOS and Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add both Mac architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: Build Apple Silicon and Intel universal app
        if: runner.os == 'macOS'
        run: npm run tauri -- build --target universal-apple-darwin --bundles app
      - name: Sign and package Mac app
        if: runner.os == 'macOS'
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Shutiao.app
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p release-mac
          ditto "$app" release-mac/Shutiao.app
          ln -s /Applications release-mac/Applications
          hdiutil create -volname Shutiao -srcfolder release-mac -ov -format UDZO Shutiao-macos-universal.dmg
      - name: Build Windows 10 / 11 installer
        if: runner.os == 'Windows'
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Shutiao-macos-universal
          path: Shutiao-macos-universal.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Shutiao-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
